name: Build FUXA Headless + Offline Plugins

on:
  workflow_dispatch:

# These are the additional SERVER-SIDE FUXA plugins that will be baked into
# the portable headless executable.
#
# FUXA master currently expects:
#   modbus-serial        8.0.19
#   chart.js             2.9.4
#   chartjs-node-canvas  3.2.0
#
# IMPORTANT:
# - The Angular/HMI client already has its own Chart.js dependency.
# - chart.js + chartjs-node-canvas below are for FUXA server-side report charts.
# - Add additional FUXA plugin packages here, one per line, using pinned versions.
env:
  EXTRA_FUXA_PLUGINS: >-
    modbus-serial@8.0.19
    chart.js@2.9.4
    chartjs-node-canvas@3.2.0

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: x64
          - os: macos-latest
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # FUXA already needs build-essential/unixODBC on Linux.
      # The Cairo/Pango packages additionally allow chartjs-node-canvas/node-canvas
      # to build from source on runners where a prebuilt native binary is unavailable
      # (notably some ARM64 combinations).
      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            unixodbc \
            unixodbc-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev

      - name: Install server dependencies
        run: |
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-retries 5
          npm install --prefer-offline --no-audit
        working-directory: ./server

      # This is the important addition.
      # Installing here puts the packages in server/node_modules before the complete
      # server tree is copied into the headless package.
      - name: Install offline FUXA plugins
        run: |
          echo "Installing additional FUXA plugins:"
          echo "${EXTRA_FUXA_PLUGINS}"
          npm install \
            --no-save \
            --package-lock=false \
            --prefer-offline \
            --no-audit \
            ${EXTRA_FUXA_PLUGINS}
        working-directory: ./server

      # Fail the build now if one of the requested packages cannot actually load.
      - name: Verify bundled plugins
        run: |
          node -e "
            require('modbus-serial');
            require('chart.js');
            require('chartjs-node-canvas');
            console.log('Verified: modbus-serial, chart.js, chartjs-node-canvas');
          "
        working-directory: ./server

      - name: Install client dependencies
        run: |
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-retries 5
          npm install --prefer-offline --no-audit
        working-directory: ./client

      - name: Build client
        run: npm run build -- --configuration=production
        working-directory: ./client

      - name: Setup Headless Package Directory
        run: |
          mkdir -p fuxa-headless/server
          mkdir -p fuxa-headless/client/dist

          # Copy the complete server tree INCLUDING node_modules and the plugins
          # installed above, then copy the built Angular client.
          cp -r server/. fuxa-headless/server/
          cp -r client/dist/. fuxa-headless/client/dist/

          # Use FUXA's headless entry point as the pkg main file.
          cp app/headless/headless-entry.js fuxa-headless/main.js
        shell: bash

      - name: Create Package Config
        run: |
          cat > fuxa-headless/package.json <<'EOF'
          {
            "name": "fuxa-headless",
            "version": "1.0.0",
            "bin": "main.js",
            "pkg": {
              "assets": [
                "server/**/*",
                "client/dist/**/*",
                "_reports/**/*"
              ],
              "compression": "Brotli"
            }
          }
          EOF
        shell: bash

      - name: Install yao-pkg
        run: npm install -g @yao-pkg/pkg

      - name: Build Standalone Binaries (Headless)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            if [ "${{ matrix.arch }}" = "arm64" ]; then
              TARGET="node20-linux-arm64"
            else
              TARGET="node20-linux-x64"
            fi
          elif [ "$RUNNER_OS" = "Windows" ]; then
            TARGET="node20-win-x64"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            if [ "${{ matrix.arch }}" = "arm64" ]; then
              TARGET="node20-macos-arm64"
            else
              TARGET="node20-macos-x64"
            fi
          fi

          echo "Packaging target: $TARGET"
          pkg fuxa-headless/package.json --targets "$TARGET" --out-path artifacts
        shell: bash
        working-directory: .

      - name: Prepare artifacts
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ] && [ "${{ matrix.arch }}" = "x64" ]; then
            mv artifacts/fuxa-headless-win-x64.exe artifacts/FUXA-headless-windows-x64.exe || true
          elif [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.arch }}" = "x64" ]; then
            mv artifacts/fuxa-headless-linux-x64 artifacts/FUXA-headless-linux-x64 || true
          elif [ "${{ matrix.os }}" = "ubuntu-24.04-arm" ] && [ "${{ matrix.arch }}" = "arm64" ]; then
            mv artifacts/fuxa-headless-linux-arm64 artifacts/FUXA-headless-linux-arm64 || true
          elif [ "${{ matrix.os }}" = "macos-latest" ] && [ "${{ matrix.arch }}" = "x64" ]; then
            mv artifacts/fuxa-headless-macos-x64 artifacts/FUXA-headless-macos-x64 || true
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            mv artifacts/fuxa-headless-macos-arm64 artifacts/FUXA-headless-macos-arm64 || true
          fi

          cat > artifacts/BUNDLED-PLUGINS.txt <<EOF
          FUXA headless custom build
          Node runtime: 20

          Additional server-side plugins:
          ${EXTRA_FUXA_PLUGINS}
          EOF
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FUXA-headless-${{ matrix.os }}-${{ matrix.arch }}
          path: artifacts/*
