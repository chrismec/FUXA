name: Build FUXA Headless - Windows x64 Offline

on:
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-2022

    steps:
      - name: Checkout FUXA
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Show build environment
        shell: pwsh
        run: |
          Write-Host "Windows:"
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber
          Write-Host ""
          Write-Host "Node:"
          node --version
          Write-Host "npm:"
          npm --version
          Write-Host ""
          Write-Host "FUXA commit:"
          git rev-parse HEAD

      - name: Install server dependencies
        working-directory: ./server
        shell: pwsh
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

          $attempt = 1
          $maxAttempts = 2

          while ($attempt -le $maxAttempts) {
            Write-Host "Server dependency install attempt $attempt of $maxAttempts..."
            npm install --prefer-offline --no-audit

            if ($LASTEXITCODE -eq 0) {
              Write-Host "Server dependencies installed successfully."
              break
            }

            if ($attempt -eq $maxAttempts) {
              throw "Server dependency installation failed after $maxAttempts attempts."
            }

            Write-Warning "npm install failed. Waiting 20 seconds before retry..."
            Start-Sleep -Seconds 20
            $attempt++
          }

      - name: Install Modbus plugin for offline use
        working-directory: ./server
        shell: pwsh
        run: |
          npm install --no-save --package-lock=false --prefer-offline --no-audit modbus-serial@8.0.19
          if ($LASTEXITCODE -ne 0) {
            throw "modbus-serial installation failed."
          }

      - name: Verify server native modules and Modbus
        working-directory: ./server
        shell: pwsh
        run: |
          node -e "require('sqlite3'); console.log('sqlite3 OK')"
          if ($LASTEXITCODE -ne 0) { throw "sqlite3 failed to load." }

          node -e "require('modbus-serial'); console.log('modbus-serial OK')"
          if ($LASTEXITCODE -ne 0) { throw "modbus-serial failed to load." }

      - name: Install client dependencies
        working-directory: ./client
        shell: pwsh
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

          $attempt = 1
          $maxAttempts = 2

          while ($attempt -le $maxAttempts) {
            Write-Host "Client dependency install attempt $attempt of $maxAttempts..."
            npm install --prefer-offline --no-audit

            if ($LASTEXITCODE -eq 0) {
              Write-Host "Client dependencies installed successfully."
              break
            }

            if ($attempt -eq $maxAttempts) {
              throw "Client dependency installation failed after $maxAttempts attempts."
            }

            Write-Warning "npm install failed. Waiting 20 seconds before retry..."
            Start-Sleep -Seconds 20
            $attempt++
          }

      - name: Build FUXA web client
        working-directory: ./client
        shell: pwsh
        run: |
          npm run build -- --configuration=production
          if ($LASTEXITCODE -ne 0) {
            throw "FUXA client build failed."
          }

      - name: Assemble headless package tree
        shell: bash
        run: |
          set -e
          mkdir -p fuxa-headless/server
          mkdir -p fuxa-headless/client/dist

          cp -r server/. fuxa-headless/server/
          cp -r client/dist/. fuxa-headless/client/dist/
          cp app/headless/headless-entry.js fuxa-headless/main.js

      - name: Create pkg configuration
        shell: bash
        run: |
          cat > fuxa-headless/package.json <<'EOF'
          {
            "name": "fuxa-headless",
            "version": "1.0.0",
            "bin": "main.js",
            "pkg": {
              "assets": [
                "server/**/*",
                "client/dist/**/*",
                "_reports/**/*"
              ],
              "compression": "Brotli"
            }
          }
          EOF

      - name: Install yao-pkg
        shell: pwsh
        run: |
          npm install -g @yao-pkg/pkg
          if ($LASTEXITCODE -ne 0) {
            throw "@yao-pkg/pkg installation failed."
          }

      - name: Build Windows x64 standalone executable
        shell: bash
        run: |
          set -e
          mkdir -p artifacts

          pkg fuxa-headless/package.json \
            --targets node20-win-x64 \
            --output artifacts/FUXA-headless-windows-x64.exe

          echo "Created:"
          ls -lh artifacts/

      - name: Create build manifest and SHA-256
        shell: pwsh
        run: |
          $exe = "artifacts/FUXA-headless-windows-x64.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected executable was not created: $exe"
          }

          $fuxaCommit = (git rev-parse HEAD).Trim()
          $nodeVersion = (node --version).Trim()
          $npmVersion = (npm --version).Trim()
          $modbusVersion = (node -p "require('./server/node_modules/modbus-serial/package.json').version").Trim()
          $sqliteVersion = (node -p "require('./server/node_modules/sqlite3/package.json').version").Trim()
          $buildUtc = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()

          @"
          FUXA custom headless build
          ==========================

          Runtime target: Windows x64
          Intended deployment: Windows 11 25H2 x64
          pkg target: node20-win-x64

          FUXA commit: $fuxaCommit
          Build UTC: $buildUtc
          Build Node: $nodeVersion
          Build npm: $npmVersion

          Baked-in additional plugin:
            modbus-serial: $modbusVersion

          Verified native dependency:
            sqlite3: $sqliteVersion

          Notes:
            - FUXA's normal Angular client assets are included.
            - Client-side Chart.js is included by the normal FUXA client build.
            - No Internet/npm installation should be required for Modbus at runtime.
          "@ | Set-Content -Encoding UTF8 artifacts/BUILD-MANIFEST.txt

          "$hash  FUXA-headless-windows-x64.exe" |
            Set-Content -Encoding ASCII artifacts/SHA256.txt

          Write-Host ""
          Write-Host "Build complete."
          Write-Host "SHA-256: $hash"
          Write-Host ""
          Get-ChildItem artifacts

      - name: Upload Windows x64 build
        uses: actions/upload-artifact@v4
        with:
          name: FUXA-headless-windows-x64-offline
          path: |
            artifacts/FUXA-headless-windows-x64.exe
            artifacts/BUILD-MANIFEST.txt
            artifacts/SHA256.txt
          if-no-files-found: error
