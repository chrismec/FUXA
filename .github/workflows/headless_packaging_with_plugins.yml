name: Build FUXA Headless - Windows x64 Offline

on:
  workflow_dispatch:
    inputs:
      fuxa_ref:
        description: 'FUXA version to build from frangoteam/FUXA: a tag (e.g. v1.3.6), a branch (master) or a commit SHA'
        required: true
        default: 'master'

env:
  # Node.js major version. Used for the build AND packaged into the exe, so they always match.
  # 22 = what FUXA itself targets since upstream PR #2662 (2026-10-29). Node 22 is supported until 2027-04-30.
  NODE_MAJOR: '22'
  # The modbus-serial version FUXA's own plugin manager installs (server/runtime/plugins/index.js).
  MODBUS_SERIAL_VERSION: '8.0.19'
  # Packager, pinned so a rebuild is repeatable. pkg 6.25.0 ships pkg-fetch 3.6.7 (Node 22.23.4).
  # pkg-fetch 3.6.8 only adds newer Node binaries; it is forced here to get Node 22.23.5 (security release 2026-11-11).
  # Once a pkg release includes pkg-fetch >= 3.6.8, set PKG_VERSION to it and PKG_FETCH_VERSION to match.
  PKG_VERSION: '6.25.0'
  PKG_FETCH_VERSION: '3.6.8'
  # Where pkg downloads its Node.js binary. Kept in the workspace so the manifest can record which one it used.
  PKG_CACHE_PATH: ${{ github.workspace }}/.pkg-cache
  # The actions below (checkout, setup-node, upload-artifact) are @v7, which run on Node 24.
  # @v4 ran on Node 20 and made GitHub show a "Node.js 20 is deprecated" warning.

jobs:
  build-windows-x64:
    runs-on: windows-2022

    steps:
      - name: Checkout FUXA (upstream frangoteam/FUXA)
        uses: actions/checkout@v7
        with:
          repository: frangoteam/FUXA
          ref: ${{ inputs.fuxa_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_MAJOR }}
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Show build environment
        shell: pwsh
        run: |
          Write-Host "Windows:"
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber
          Write-Host ""
          Write-Host "Node:"
          node --version
          Write-Host "npm:"
          npm --version
          Write-Host ""
          Write-Host "FUXA commit:"
          git rev-parse HEAD
          Write-Host "FUXA version:"
          node -p "require('./server/package.json').version"

      - name: Install server dependencies
        working-directory: ./server
        shell: pwsh
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

          $attempt = 1
          $maxAttempts = 2

          while ($attempt -le $maxAttempts) {
            Write-Host "Server dependency install attempt $attempt of $maxAttempts..."
            npm install --prefer-offline --no-audit

            if ($LASTEXITCODE -eq 0) {
              Write-Host "Server dependencies installed successfully."
              break
            }

            if ($attempt -eq $maxAttempts) {
              throw "Server dependency installation failed after $maxAttempts attempts."
            }

            Write-Warning "npm install failed. Waiting 20 seconds before retry..."
            Start-Sleep -Seconds 20
            $attempt++
          }

      - name: Install Modbus plugin for offline use
        working-directory: ./server
        shell: pwsh
        run: |
          npm install --no-save --package-lock=false --prefer-offline --no-audit "modbus-serial@$env:MODBUS_SERIAL_VERSION"
          if ($LASTEXITCODE -ne 0) {
            throw "modbus-serial installation failed."
          }

      - name: Verify server native modules and Modbus
        working-directory: ./server
        shell: pwsh
        run: |
          node -e "require('sqlite3'); console.log('sqlite3 OK')"
          if ($LASTEXITCODE -ne 0) { throw "sqlite3 failed to load." }

          node -e "require('modbus-serial'); console.log('modbus-serial OK')"
          if ($LASTEXITCODE -ne 0) { throw "modbus-serial failed to load." }

      - name: Install client dependencies
        working-directory: ./client
        shell: pwsh
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

          $attempt = 1
          $maxAttempts = 2

          while ($attempt -le $maxAttempts) {
            Write-Host "Client dependency install attempt $attempt of $maxAttempts..."
            npm install --prefer-offline --no-audit

            if ($LASTEXITCODE -eq 0) {
              Write-Host "Client dependencies installed successfully."
              break
            }

            if ($attempt -eq $maxAttempts) {
              throw "Client dependency installation failed after $maxAttempts attempts."
            }

            Write-Warning "npm install failed. Waiting 20 seconds before retry..."
            Start-Sleep -Seconds 20
            $attempt++
          }

      - name: Build FUXA web client
        working-directory: ./client
        shell: pwsh
        run: |
          npm run build -- --configuration=production
          if ($LASTEXITCODE -ne 0) {
            throw "FUXA client build failed."
          }

      - name: Assemble headless package tree
        shell: bash
        run: |
          set -e
          mkdir -p fuxa-headless/server
          mkdir -p fuxa-headless/client/dist

          cp -r server/. fuxa-headless/server/
          cp -r client/dist/. fuxa-headless/client/dist/
          cp app/headless/headless-entry.js fuxa-headless/main.js

      - name: Create pkg configuration
        shell: bash
        run: |
          cat > fuxa-headless/package.json <<'EOF'
          {
            "name": "fuxa-headless",
            "version": "1.0.0",
            "bin": "main.js",
            "pkg": {
              "assets": [
                "server/**/*",
                "client/dist/**/*",
                "_reports/**/*"
              ],
              "compression": "Brotli"
            }
          }
          EOF

      - name: Install yao-pkg (pinned)
        shell: pwsh
        run: |
          # Run npm from inside pkg-tool. On the Windows runner, npm ignored --prefix and looked for
          # package.json in the repo root instead (first run of this workflow, 2026-11-17).
          New-Item -ItemType Directory -Force pkg-tool | Out-Null
          Push-Location pkg-tool
          try {
            @{
              name = 'pkg-tool'
              private = $true
              dependencies = @{ '@yao-pkg/pkg' = $env:PKG_VERSION }
              overrides = @{ '@yao-pkg/pkg-fetch' = $env:PKG_FETCH_VERSION }
            } | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 package.json

            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) {
              throw "@yao-pkg/pkg installation failed."
            }
          } finally {
            Pop-Location
          }

          $fetchPkg = 'pkg-tool/node_modules/@yao-pkg/pkg-fetch/package.json'
          if (-not (Test-Path $fetchPkg)) {
            $fetchPkg = 'pkg-tool/node_modules/@yao-pkg/pkg/node_modules/@yao-pkg/pkg-fetch/package.json'
          }
          $fetchVersion = (Get-Content $fetchPkg -Raw | ConvertFrom-Json).version
          if ($fetchVersion -ne $env:PKG_FETCH_VERSION) {
            throw "pkg-fetch is $fetchVersion, expected $env:PKG_FETCH_VERSION"
          }
          Write-Host "pkg-fetch $fetchVersion OK"

      - name: Build Windows x64 standalone executable
        shell: bash
        run: |
          set -e
          mkdir -p artifacts

          # Call pkg's entry script with node directly, so no npm .bin wrapper is involved on Windows.
          node pkg-tool/node_modules/@yao-pkg/pkg/lib-es5/bin.js fuxa-headless/package.json \
            --targets "node${NODE_MAJOR}-win-x64" \
            --output artifacts/FUXA-headless-windows-x64.exe

          echo "Created:"
          ls -lh artifacts/

      - name: Create build manifest and SHA-256
        shell: pwsh
        env:
          FUXA_REF: ${{ inputs.fuxa_ref }}
        run: |
          $exe = "artifacts/FUXA-headless-windows-x64.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected executable was not created: $exe"
          }

          $fuxaCommit = (git rev-parse HEAD).Trim()
          $fuxaVersion = (node -p "require('./server/package.json').version").Trim()
          $nodeVersion = (node --version).Trim()
          $npmVersion = (npm --version).Trim()
          $modbusVersion = (node -p "require('./server/node_modules/modbus-serial/package.json').version").Trim()
          $sqliteVersion = (node -p "require('./server/node_modules/sqlite3/package.json').version").Trim()
          $pkgVersion = (Get-Content pkg-tool/node_modules/@yao-pkg/pkg/package.json -Raw | ConvertFrom-Json).version
          $buildUtc = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()

          # The Node.js binary pkg packed into the exe (pkg names it fetched-<version>-win-x64).
          $fetched = @(Get-ChildItem -Path $env:PKG_CACHE_PATH -Recurse -File -ErrorAction SilentlyContinue |
            ForEach-Object { if ($_.Name -match '^fetched-(v\d+\.\d+\.\d+)-win-x64$') { $Matches[1] } })
          if ($fetched.Count -eq 0) {
            $packagedNode = "unknown (see the pkg step log)"
            Write-Warning "Could not find the packaged Node.js binary in $env:PKG_CACHE_PATH"
          } else {
            $packagedNode = $fetched -join ', '
          }

          @"
          FUXA custom headless build
          ==========================

          Runtime target: Windows x64
          Intended deployment: Windows 11 25H2 x64
          pkg target: node$($env:NODE_MAJOR)-win-x64
          Packaged Node.js runtime: $packagedNode

          FUXA source: frangoteam/FUXA, requested ref: $($env:FUXA_REF)
          FUXA commit: $fuxaCommit
          FUXA version: $fuxaVersion
          Build UTC: $buildUtc
          Build Node: $nodeVersion
          Build npm: $npmVersion
          Packager: @yao-pkg/pkg $pkgVersion, @yao-pkg/pkg-fetch $($env:PKG_FETCH_VERSION)

          Baked-in additional plugin:
            modbus-serial: $modbusVersion

          Verified native dependency:
            sqlite3: $sqliteVersion

          Notes:
            - FUXA's normal Angular client assets are included.
            - Client-side Chart.js is included by the normal FUXA client build.
            - No Internet/npm installation should be required for Modbus at runtime.
          "@ | Set-Content -Encoding UTF8 artifacts/BUILD-MANIFEST.txt

          "$hash  FUXA-headless-windows-x64.exe" |
            Set-Content -Encoding ASCII artifacts/SHA256.txt

          Write-Host ""
          Write-Host "Build complete."
          Write-Host "SHA-256: $hash"
          Write-Host ""
          Get-Content artifacts/BUILD-MANIFEST.txt
          Get-ChildItem artifacts

      - name: Upload Windows x64 build
        uses: actions/upload-artifact@v7
        with:
          name: FUXA-headless-windows-x64-offline
          path: |
            artifacts/FUXA-headless-windows-x64.exe
            artifacts/BUILD-MANIFEST.txt
            artifacts/SHA256.txt
          if-no-files-found: error
